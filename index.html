<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Dents</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="css/styles.css?v=21">
</head>
<body>

<!-- LOGIN (CPF ou e-mail + senha) -->
<section id="login-view" hidden>
  <form class="login-card" id="login-form">
    <img src="img/logo.png" alt="My Dents Odontologia & Estética">
<h1>My Dents</h1>
    <p>Acesse o painel da clínica</p>
    <label>CPF ou e-mail<input type="text" id="login-email" required autocomplete="username" inputmode="text" placeholder="000.000.000-00"></label>
    <label>Senha<input type="password" id="login-senha" required autocomplete="current-password"></label>
    <div class="err" id="login-err"></div>
    <button class="btn" style="width:100%">Entrar</button>
  </form>
</section>

<!-- APP: o menu e as telas são registrados pelos módulos em js/ -->
<div id="app-view" hidden>
  <aside id="sidebar">
    <div class="logo"><img class="logo-full" src="img/logo.png" alt="My Dents"><img class="logo-mini" src="img/favicon.png" alt="My Dents"></div>
    <nav class="nav" id="nav"></nav>
    <div style="margin-top:auto;font-size:.8rem;color:#5f7680">
      <div id="user-email" class="side-info" style="word-break:break-all;margin-bottom:.5rem"></div>
      <button class="btn ghost sm" id="btn-logout" >Sair</button>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div class="actions">
        <button class="btn ghost sm menu-btn" id="btn-menu" aria-label="Menu">☰</button>
        <h2 id="view-title">Início</h2>
      </div>
      <div class="actions">
        <select id="filtro-unidade" aria-label="Unidade"></select>
      </div>
    </div>
    <div id="view-root"></div>
  </main>
</div>

<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=21"></script>
<script src="js/app.js?v=21"></script>
<script src="js/cadastros.js?v=21"></script>
<script src="js/orcamentos.js?v=21"></script>
<script src="js/debitos.js?v=21"></script>
<script src="js/caixa.js?v=21"></script>
<script src="js/producao.js?v=21"></script>
<script src="js/financeiro.js?v=21"></script>
<script src="js/laboratorio.js?v=21"></script>
<script src="js/estoque.js?v=21"></script>
<script src="js/nfse-xml.js?v=21"></script>
<script src="js/nfse.js?v=21"></script>
<script src="js/marketing.js?v=21"></script>
<script src="js/paciente.js?v=21"></script>
<script src="js/grupos.js?v=21"></script>
<script src="js/export.js?v=21"></script>
<script>window.MD.start();</script>
</body>
</html>
